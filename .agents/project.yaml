spec: 1

identity:
  name: git-follow
  author: Phorcys
  holder: Phorcys
  nature: open-source
  visibility: public
  since: 2026

audience:
  - Obsidian users whose vault holds several Git repositories

lifecycle:
  stage: draft
  registries: {}
  ci:
    mode: manual
    activation: consent

agent:
  autonomy:
    commit: never
    push: never
    version-bump: ask
    commit-when: gate-passes
